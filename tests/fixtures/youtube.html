<!DOCTYPE html>
<!-- Local stand-in for youtube.com / youtubekids.com used by the browser tests.
     It imitates a video page with an endless list of suggestions but loads
     nothing from the network. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>YouTube (local test fixture)</title>
<style>
  body { margin: 0; font-family: Roboto, Arial, sans-serif; background: #fff; }
  header { position: sticky; top: 0; height: 56px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); display: flex; align-items: center; padding: 0 16px; }
  main { display: flex; gap: 24px; max-width: 1100px; margin: 16px auto; }
  #player { flex: 2; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; }
  #related { flex: 1; }
  .video { height: 90px; margin-bottom: 8px; background: #f2f2f2; border-radius: 8px; padding: 8px; }
</style>
</head>
<body>
<header><a href="/">YouTube</a></header>
<main>
  <div id="player" aria-label="Video player"></div>
  <div id="related" aria-label="Up next"></div>
</main>
<script>
  // Imitate suggestions that keep loading after the page has loaded.
  const related = document.getElementById('related');
  let videos = 0;
  function addVideo() {
    const video = document.createElement('div');
    video.className = 'video';
    video.textContent = `Suggested video ${++videos}`;
    related.append(video);
  }
  for (let i = 0; i < 3; i++) addVideo();
  setInterval(addVideo, 500);
</script>
</body>
</html>
