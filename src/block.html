<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time for a break!</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Comic Neue", "Trebuchet MS", "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(160deg, #fff6d6 0%, #d8f3ff 100%);
    color: #23324a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .card {
    background: #fff;
    border: 4px solid #4caf50;
    border-radius: 24px;
    padding: 40px 32px;
    max-width: 560px;
    width: 92%;
    box-shadow: 0 10px 30px rgba(35, 50, 74, 0.15);
  }
  .icon { font-size: 4rem; margin-bottom: 8px; }
  h1 {
    font-size: 2.4rem;
    margin-bottom: 16px;
    color: #2e7d32;
  }
  #idea {
    font-size: 1.6rem;
    font-weight: 700;
    color: #1565c0;
    margin-bottom: 28px;
    min-height: 2.6em;
  }
  .stat {
    font-size: 1.1rem;
    color: #4a5a70;
    margin-bottom: 24px;
  }
  .stat a { color: #1565c0; }
  .grown-ups { font-size: 0.9rem; margin-bottom: 0; margin-top: 24px; }
  button {
    background: #4caf50;
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 14px 34px;
    font: inherit;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.2s;
  }
  button:active { transform: scale(0.96); }
  button:hover, button:focus-visible { box-shadow: 0 0 0 4px #c8e6c9; }
  .footer {
    margin-top: 28px;
    font-size: 1rem;
    color: #4a5a70;
  }
</style>
</head>
<body>
<div class="card">
  <div class="icon" aria-hidden="true">📚</div>
  <h1>Time for a break!</h1>
  <p id="limit-message" class="stat">You have watched enough YouTube for today. Now it’s time to study. YouTube will be back tomorrow!</p>
  <div id="idea" aria-live="polite">Let’s find something fun to do…</div>
  <button id="close">Close this tab</button>
  <div class="footer">Great job taking a break. See you tomorrow! 🌟</div>
  <p class="stat grown-ups"><a href="options.html">Grown-ups: change the daily limit</a></p>
</div>
<script src="ext.js"></script>
<script src="settings.js"></script>
<script src="block.js"></script>
</body>
</html>
